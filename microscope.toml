[instrument_info]
manufacturer='FEI'
model='FIB 200'

# Single ion column. The scan-select relay follows external control, so it
# must be the ion role: the gateware drives electron scan_enable constantly.
# Blanker input is differential (A2 inverted, A3 normal) at 3.3 V.
[beam.ion]

[beam.ion.pinout]
scan_enable = "A0:1"
blank_enable = "A4:5"
blank = "A2#,A3"

[transforms]
yflip = true
rotate90 = true

[timings]
ext_switch_delay_ms = 20
