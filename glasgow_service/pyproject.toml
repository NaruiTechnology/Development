[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glasgow-service"
version = "0.2.0"
description = "Long-lived HTTP/WebSocket service wrapping a single Glasgow device."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "redis>=5.0,<8",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
examples = ["websockets>=12"]
tests    = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["glasgow_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
