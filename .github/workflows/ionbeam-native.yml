# Build, test and package the native desktop app (ionbeam-native/).
# Artifacts: the installable bundle (.tar.gz/.zip + SHA256SUMS) and the
# emulator benchmark report. Hardware is never touched in CI.
name: ionbeam-native

on:
  push:
    paths:
      - "ionbeam-native/**"
      - "glasgow_service/**"
      - "GlasgowDataIO/**"
      - "AutomationPy/**"
      - "ionbeam-web/frontend/src/lib/**"
      - "DeployWorkSpace/Development/DistributionDeploy/**"
      - "buildCompiledDist.py"
      - ".github/workflows/ionbeam-native.yml"
  pull_request:
    paths:
      - "ionbeam-native/**"
      - "glasgow_service/**"
      - "GlasgowDataIO/**"
      - "AutomationPy/**"
      - "ionbeam-web/frontend/src/lib/**"
      - "DeployWorkSpace/Development/DistributionDeploy/**"
      - "buildCompiledDist.py"
      - ".github/workflows/ionbeam-native.yml"
  workflow_dispatch:

concurrency:
  group: ionbeam-native-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  web-parity-fixture:
    name: Web parity fixture is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regenerate tests/parity/web_cases.json from the web sources
        working-directory: ionbeam-native/tests/parity
        run: |
          npm install --no-audit --no-fund
          npm run generate
      - name: Fail if the web logic changed without updating the native port
        run: git diff --exit-code -- ionbeam-native/tests/parity/web_cases.json

  linux:
    name: Linux - install, test, smoke, bundle
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ionbeam-native/requirements*.txt
      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
      - name: Install (same script operators use)
        run: ionbeam-native/scripts/install_linux.sh --dev --no-desktop-entry --no-launcher --skip-smoke
      - name: Operations build/deploy workflow tests (includes installIonbeamNative)
        working-directory: DeployWorkSpace/Development/DistributionDeploy
        run: |
          "$GITHUB_WORKSPACE/ionbeam-native/.venv/bin/python" -m pytest -q -p no:cacheprovider tests
      - name: Lint, tests, smoke and bundle
        run: ionbeam-native/.venv/bin/python ionbeam-native/scripts/build.py --out dist
      - name: Emulator benchmark (web model vs native)
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/ionbeam-native/.venv/bin/python" \
            "$GITHUB_WORKSPACE/ionbeam-native/scripts/benchmark_pipeline.py" \
            --frames 5 --resolution 512 --json > "$GITHUB_WORKSPACE/dist/benchmark-emulator.json"
          cat "$GITHUB_WORKSPACE/dist/benchmark-emulator.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ionbeam-native-bundle
          path: dist/
          if-no-files-found: error

  windows:
    name: Windows - install and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ionbeam-native/requirements*.txt
      - name: Install (same script operators use)
        shell: pwsh
        run: ionbeam-native/scripts/install_windows.ps1 -Dev -NoShortcut
      - name: Tests
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          & "$env:GITHUB_WORKSPACE\ionbeam-native\.venv\Scripts\python.exe" -m pytest -q -p no:cacheprovider `
            "$env:GITHUB_WORKSPACE\ionbeam-native\tests"
